# Local MariaDB + PostgreSQL for trying out the sync pipeline.
# Start with: docker compose up -d
services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: sap_middleware
      MARIADB_USER: sap
      MARIADB_PASSWORD: sap
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sap_middleware
      POSTGRES_USER: sap
      POSTGRES_PASSWORD: sap
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  mariadb_data:
  postgres_data:
